name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) whenever a GitHub release
# is published. The PyPI-side publisher is registered for this repo with
# workflow file release.yml and environment pypi; no API tokens exist.
# Building here (clean checkout) rather than on a dev machine keeps the
# runtime-generated serve/static/css/pygments.css out of the wheel.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
