[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solidity-flow-navigator"
version = "0.0.1"
description = "Per-entry-point navigable call-graph visualizations of Solidity repositories, for Web3 security auditors."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Norah" },
]
keywords = ["solidity", "security", "audit", "static-analysis", "slither"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "slither-analyzer>=0.11.5,<0.12",
    "Flask>=3.0,<4.0",
    "Pygments>=2.17,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "black>=24.0",
    "ruff>=0.5",
]

[project.scripts]
solflow = "solidity_flow_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solidity_flow_navigator = ["serve/static/**/*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
