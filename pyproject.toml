[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solflow"
version = "0.13.0"
description = "Per-entry-point navigable call-graph visualizations of Solidity repositories, for Web3 security auditors."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [
    { name = "Norah" },
]
keywords = ["solidity", "security", "audit", "static-analysis", "slither"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "slither-analyzer>=0.11.5,<0.12",
    "Flask>=3.0,<4.0",
    "Pygments>=2.17,<3.0",
    "pathspec>=1.1.1,<2",
]

[project.urls]
Repository = "https://github.com/norah1499/solidity-flow-navigator"
Issues = "https://github.com/norah1499/solidity-flow-navigator/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "black>=26,<27",
    "ruff>=0.5",
]

[project.scripts]
solflow = "solidity_flow_navigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
solidity_flow_navigator = [
    "serve/static/**/*",
    "serve/templates/**/*",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Module-level one-line docstrings are a recognized E501 exception. The
# scaffold files committed in bd475e3 carry such docstrings; rather than
# wrapping them, we ignore E501 file-by-file so any future per-line lint
# remains in force.
# docs/probes/ holds historical diagnostic scripts whose long aligned print
# lines are kept verbatim as reference artifacts.
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E501"]
"docs/probes/*" = ["E501"]
"src/solidity_flow_navigator/flow/builder.py" = ["E501"]
"src/solidity_flow_navigator/flow/scope.py" = ["E501"]
"src/solidity_flow_navigator/flow/types.py" = ["E501"]
"tests/flow/test_builder.py" = ["E501"]
"tests/flow/test_scope.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
